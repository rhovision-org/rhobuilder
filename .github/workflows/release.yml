name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - run: cargo build --release -p rhobuilder-cli
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/rhobuilder-linux-x86_64.tar.gz \
            -C target/release rhobuilder \
            -C "$GITHUB_WORKSPACE" README.md LICENSE THIRD_PARTY_NOTICES.md
          (cd dist && sha256sum rhobuilder-linux-x86_64.tar.gz > rhobuilder-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: rhobuilder-linux-x86_64
          path: dist/*
      - name: Publish tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
