name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p rhobuilder-cli
      - run: ./target/debug/rhobuilder --json design check --path fixtures/designs/booking.json
      - run: ./target/debug/rhobuilder --json design check --path fixtures/designs/duplicate-escrow.json && exit 1 || exit 0

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check agents/deepseek/plugin/index.js
      - run: node --check agents/deepseek/plugin/bridge.js
      - run: node --test agents/deepseek/plugin/test/*.test.mjs
      - run: node --check mcp/server.mjs
      - run: node --test mcp/test/*.test.mjs

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/check_registry.py --json
      - run: python3 tools/vendor_install.py --check
      - run: python3 tools/gate_sync.py --check
      - run: python3 tools/launch_dsh.py --print-config headless

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean/RhoApp

  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - run: make scaffold-e2e
      - run: |
          cargo run -q -p rhobuilder-cli -- new /tmp/rhobuilder-full \
            --design fixtures/designs/booking.json --template full --apply --force
          make -C /tmp/rhobuilder-full client-check
          npm --prefix /tmp/rhobuilder-full/web audit --audit-level=high

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - run: mdbook build
      - run: python3 tools/check_docs.py
