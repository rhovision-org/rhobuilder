[workspace]
resolver = "2"
exclude = [".devnet/parse-check"]
members = [
  "crates/__app__-core",
  "crates/__app__-sdk",
  "crates/__app__-cli",
]
default-members = [
  "crates/__app__-core",
  "crates/__app__-sdk",
  "crates/__app__-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.95"
repository = "https://github.com/rhovision-org/__app__"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
__app__-core = { path = "crates/__app__-core" }
__app__-sdk = { path = "crates/__app__-sdk" }
